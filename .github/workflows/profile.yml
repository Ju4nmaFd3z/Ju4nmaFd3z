name: Perfil — estadísticas y ciudad 3D

# Regenera las piezas dinámicas del README y las publica en la rama `output`:
#   stats-dark.svg / stats-light.svg  → generador propio (scripts/stats, sin dependencias)
#   city-dark.svg  / city-light.svg   → yoshi389111/github-profile-3d-contrib + post-proceso B/N (scripts/city)

on:
  schedule:
    - cron: "0 */12 * * *" # cada 12 horas
  workflow_dispatch: # lanzamiento manual desde la pestaña Actions
  push:
    branches: [main]
    paths:
      - "scripts/**"
      - ".github/workflows/profile.yml"

permissions:
  contents: write

concurrency:
  group: profile-output
  cancel-in-progress: true

jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Descargar el repositorio
        uses: actions/checkout@v5

      - name: Preparar Node
        uses: actions/setup-node@v5
        with:
          node-version: 22

      - name: Estadísticas (GraphQL → SVG)
        run: node scripts/stats/generate.mjs --user "${{ github.repository_owner }}" --out dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Ciudad 3D de contribuciones
        uses: yoshi389111/github-profile-3d-contrib@v0.9.3
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          USERNAME: ${{ github.repository_owner }}
          SETTING_JSON: scripts/city/settings.json

      - name: Ciudad 3D en blanco y negro (solo la ciudad, recortada)
        run: |
          node scripts/city/mono.mjs profile-3d-contrib/city-dark.svg dist/city-dark.svg
          node scripts/city/mono.mjs profile-3d-contrib/city-light.svg dist/city-light.svg

      - name: Publicar en la rama output
        run: |
          cd dist
          git init -q
          git checkout -q -b output
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -q -m "Actualizar estadísticas y ciudad 3D [skip ci]"
          git push -f "https://x-access-token:${GITHUB_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" output
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
