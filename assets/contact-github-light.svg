<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 184 56" width="184" height="56" fill="none" role="img" aria-labelledby="t d">
<title id="t">GitHub</title>
<desc id="d">Botón de contacto: GitHub.</desc>
<style>.f1{fill:#0A0A0A}.f2{fill:#525252}.f3{fill:#8A8A8A}
.s1{stroke:#0A0A0A;fill:none}.s2{stroke:#525252;fill:none}.s3{stroke:#8A8A8A;fill:none}
.hl{stroke-opacity:.18;stroke-width:1;vector-effect:non-scaling-stroke;transform-box:fill-box;transform-origin:0 50%;animation:grow-x 1200ms cubic-bezier(.65,0,.35,1) both}
.ol{stroke-width:1;vector-effect:non-scaling-stroke;fill:none}
.fade{animation:fade 800ms cubic-bezier(.16,1,.3,1) both}
.ast{animation:rot 12s linear infinite}
.blink{animation:blink 1.6s steps(1,end) 1500ms infinite}
@keyframes grow-x{from{transform:scaleX(0)}}
@keyframes fade{from{opacity:0;transform:translateY(6px)}}
@keyframes rot{to{transform:rotate(360deg)}}
@keyframes blink{0%{opacity:1}50%{opacity:0}}
@keyframes rise{from{transform:translateY(var(--rise,120px))}}
.pill{stroke-opacity:.35;stroke-width:1;vector-effect:non-scaling-stroke;stroke-dasharray:1;animation:draw 1400ms cubic-bezier(.65,0,.35,1) 360ms both}
@keyframes draw{from{stroke-dashoffset:1}}
.nudge{animation:nudge 3.2s cubic-bezier(.65,0,.35,1) 3200ms infinite}
@keyframes nudge{0%,70%,100%{transform:translate(0,0)}80%{transform:translate(3px,-3px)}90%{transform:translate(0,0)}}
@media (prefers-reduced-motion:reduce){*{animation:none!important}}
</style>
